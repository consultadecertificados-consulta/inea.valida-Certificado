    function validarFolio() {
        // Obtenemos el valor del input y limpiamos espacios
        const inputElement = document.getElementById('FolioInput');
        if (!inputElement) return;

        const folioInput = inputElement.value.trim().toLowerCase();

        // Verificamos si el folio existe en nuestra base de datos
        if (baseDatos[folioInput]) {
            const data = baseDatos[folioInput];

            // Asignamos los valores a los elementos HTML
            document.getElementById('lblNombre').innerText = data.nombre;
            document.getElementById('lblNivel').innerText = data.nivel;
            document.getElementById('lblPromedio').innerText = data.promedio;
            document.getElementById('lblConclusion').innerText = data.conclusion;
            document.getElementById('lblEmision').innerText = data.emision;
            document.getElementById('lblLugar').innerText = data.lugar;
            document.getElementById('lblFolio').innerText = folioInput.toUpperCase();
            document.getElementById('lblID').innerText = data.id;

            // Ocultamos el buscador y mostramos el resultado
            document.getElementById('Busqueda').style.display = 'none';
            document.getElementById('DatosCertificado').style.display = 'block';
            
            // Subir al inicio de la página para ver el resultado
            window.scrollTo(0, 0);
        } else {
            alert("Folio no encontrado. Verifique que esté bien escrito.");
        }
    }

    function regresarBusqueda() {
        document.getElementById('Busqueda').style.display = 'block';
        document.getElementById('DatosCertificado').style.display = 'none';
        document.getElementById('FolioInput').value = "";
